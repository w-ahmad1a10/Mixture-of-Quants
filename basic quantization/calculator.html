<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Quantization Error Calculator</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; background: #f5f5f5; }
  h1 { color: #333; }
  .card { background: #fff; padding: 16px; margin: 12px 0; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
  label { font-weight: bold; margin-right: 8px; }
  select { padding: 6px; font-size: 14px; min-width: 220px; }
  .row { display: flex; gap: 20px; flex-wrap: wrap; align-items: center; margin: 8px 0; }
  .result { font-size: 18px; color: #2c3e50; margin: 8px 0; }
  .big { font-size: 24px; font-weight: bold; color: #e74c3c; }
  table { border-collapse: collapse; width: 100%; margin-top: 12px; }
  th, td { border: 1px solid #ddd; padding: 6px 8px; text-align: left; font-size: 13px; }
  th { background: #3498db; color: #fff; cursor: pointer; }
  tr:nth-child(even) { background: #f9f9f9; }
  .filter { margin: 8px 0; }
  button { padding: 8px 14px; background: #3498db; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
  button:hover { background: #2980b9; }
</style>
</head>
<body>
<h1>Quantization Error Calculator</h1>
<p>Compare two quantization variants. Pick model A and model B. The calculator shows how many times larger the error of B is compared to A.</p>

<div class="card">
  <div class="row">
    <label for="bitFilter">Filter by bits:</label>
    <select id="bitFilter" onchange="renderTable(); updateCompare();">
      <option value="all">All</option>
      <option value="3">3-bit</option>
      <option value="4">4-bit</option>
      <option value="6">6-bit</option>
      <option value="8">8-bit</option>
    </select>
  </div>
  <div class="row">
    <label for="modelA">Model A:</label>
    <select id="modelA" onchange="updateCompare()"></select>
    <label for="modelB">Model B:</label>
    <select id="modelB" onchange="updateCompare()"></select>
  </div>
  <div class="result" id="resultA"></div>
  <div class="result" id="resultB"></div>
  <div class="result big" id="ratio"></div>
  <div class="result" id="tradeoff"></div>
</div>

<div class="card">
  <h2>All variants</h2>
  <table id="table">
    <thead>
      <tr>
        <th onclick="sortTable(0)">Variant</th>
        <th onclick="sortTable(1)">Bits</th>
        <th onclick="sortTable(2)">MSE</th>
        <th onclick="sortTable(3)">X-times</th>
        <th onclick="sortTable(4)">Overhead %</th>
        <th onclick="sortTable(5)">Total bits</th>
        <th onclick="sortTable(6)">Size KB</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>

<script>
const data = [
  {name:"sym_tensor_3bit", bits:3, mse:3.913943e-02, x:7.21, oh:0.00, total:786448, kb:96.00},
  {name:"sym_channel_3bit", bits:3, mse:1.851936e-02, x:3.41, oh:1.04, total:794624, kb:97.00},
  {name:"sym_group32_3bit", bits:3, mse:9.949792e-03, x:1.83, oh:16.67, total:917504, kb:112.00},
  {name:"sym_group64_3bit", bits:3, mse:1.346596e-02, x:2.48, oh:8.33, total:851968, kb:104.00},
  {name:"sym_group128_3bit", bits:3, mse:1.503087e-02, x:2.77, oh:4.17, total:819200, kb:100.00},
  {name:"sym_tensor_4bit", bits:4, mse:6.867167e-03, x:5.49, oh:0.00, total:1048592, kb:128.00},
  {name:"sym_channel_4bit", bits:4, mse:3.447016e-03, x:2.76, oh:0.78, total:1056768, kb:129.00},
  {name:"sym_group32_4bit", bits:4, mse:1.848271e-03, x:1.48, oh:12.50, total:1179648, kb:144.00},
  {name:"sym_group64_4bit", bits:4, mse:2.343813e-03, x:1.87, oh:6.25, total:1114112, kb:136.00},
  {name:"sym_group128_4bit", bits:4, mse:2.488448e-03, x:1.99, oh:3.12, total:1081344, kb:132.00},
  {name:"sym_tensor_6bit", bits:6, mse:4.100839e-04, x:6.07, oh:0.00, total:1572880, kb:192.00},
  {name:"sym_channel_6bit", bits:6, mse:1.792970e-04, x:2.65, oh:0.52, total:1581056, kb:193.00},
  {name:"sym_group32_6bit", bits:6, mse:9.906423e-05, x:1.47, oh:8.33, total:1703936, kb:208.00},
  {name:"sym_group64_6bit", bits:6, mse:1.214576e-04, x:1.80, oh:4.17, total:1638400, kb:200.00},
  {name:"sym_group128_6bit", bits:6, mse:1.292651e-04, x:1.91, oh:2.08, total:1605632, kb:196.00},
  {name:"sym_tensor_8bit", bits:8, mse:2.109177e-05, x:4.85, oh:0.00, total:2097168, kb:256.00},
  {name:"sym_channel_8bit", bits:8, mse:1.022835e-05, x:2.35, oh:0.39, total:2105344, kb:257.00},
  {name:"sym_group32_8bit", bits:8, mse:5.775476e-06, x:1.33, oh:6.25, total:2228224, kb:272.00},
  {name:"sym_group64_8bit", bits:8, mse:6.809107e-06, x:1.57, oh:3.12, total:2162688, kb:264.00},
  {name:"sym_group128_8bit", bits:8, mse:7.259965e-06, x:1.67, oh:1.56, total:2129920, kb:260.00},
  {name:"asym_tensor_3bit", bits:3, mse:2.851805e-02, x:5.25, oh:0.00, total:786464, kb:96.00},
  {name:"asym_channel_3bit", bits:3, mse:1.349947e-02, x:2.49, oh:2.08, total:802816, kb:98.00},
  {name:"asym_group32_3bit", bits:3, mse:5.429445e-03, x:1.00, oh:33.33, total:1048576, kb:128.00},
  {name:"asym_group64_3bit", bits:3, mse:6.884052e-03, x:1.27, oh:16.67, total:917504, kb:112.00},
  {name:"asym_group128_3bit", bits:3, mse:8.886034e-03, x:1.64, oh:8.33, total:851968, kb:104.00},
  {name:"asym_tensor_4bit", bits:4, mse:5.481911e-03, x:4.38, oh:0.00, total:1048608, kb:128.00},
  {name:"asym_channel_4bit", bits:4, mse:2.491839e-03, x:1.99, oh:1.56, total:1064960, kb:130.00},
  {name:"asym_group32_4bit", bits:4, mse:1.250711e-03, x:1.00, oh:25.00, total:1310720, kb:160.00},
  {name:"asym_group64_4bit", bits:4, mse:1.721061e-03, x:1.38, oh:12.50, total:1179648, kb:144.00},
  {name:"asym_group128_4bit", bits:4, mse:2.004518e-03, x:1.60, oh:6.25, total:1114112, kb:136.00},
  {name:"asym_tensor_6bit", bits:6, mse:3.292388e-04, x:4.87, oh:0.00, total:1572896, kb:192.00},
  {name:"asym_channel_6bit", bits:6, mse:1.515799e-04, x:2.24, oh:1.04, total:1589248, kb:194.00},
  {name:"asym_group32_6bit", bits:6, mse:6.755863e-05, x:1.00, oh:16.67, total:1835008, kb:224.00},
  {name:"asym_group64_6bit", bits:6, mse:9.331138e-05, x:1.38, oh:8.33, total:1703936, kb:208.00},
  {name:"asym_group128_6bit", bits:6, mse:1.109101e-04, x:1.64, oh:4.17, total:1638400, kb:200.00},
  {name:"asym_tensor_8bit", bits:8, mse:1.970352e-05, x:4.53, oh:0.00, total:2097184, kb:256.00},
  {name:"asym_channel_8bit", bits:8, mse:9.060444e-06, x:2.08, oh:0.78, total:2113536, kb:258.00},
  {name:"asym_group32_8bit", bits:8, mse:4.348916e-06, x:1.00, oh:12.50, total:2359296, kb:288.00},
  {name:"asym_group64_8bit", bits:8, mse:4.522607e-06, x:1.04, oh:6.25, total:2228224, kb:272.00},
  {name:"asym_group128_8bit", bits:8, mse:6.501965e-06, x:1.50, oh:3.12, total:2162688, kb:264.00},
];

function filteredData() {
  const f = document.getElementById("bitFilter").value;
  if (f === "all") return data;
  return data.filter(d => d.bits === parseInt(f));
}

function populateSelects() {
  const selA = document.getElementById("modelA");
  const selB = document.getElementById("modelB");
  selA.innerHTML = "";
  selB.innerHTML = "";
  filteredData().forEach((d, i) => {
    const optA = new Option(d.name + " (" + d.bits + "bit)", i);
    const optB = new Option(d.name + " (" + d.bits + "bit)", i);
    selA.add(optA);
    selB.add(optB);
  });
  if (selB.options.length > 1) selB.selectedIndex = 1;
}

function updateCompare() {
  const fd = filteredData();
  const a = fd[document.getElementById("modelA").selectedIndex];
  const b = fd[document.getElementById("modelB").selectedIndex];
  if (!a || !b) return;
  document.getElementById("resultA").innerHTML =
    "<b>" + a.name + " (" + a.bits + "bit)</b>: MSE = " + a.mse.toExponential(4) +
    ", X-times = " + a.x.toFixed(2) + "x, Overhead = " + a.oh.toFixed(2) + "%, Size = " + a.kb.toFixed(2) + " KB";
  document.getElementById("resultB").innerHTML =
    "<b>" + b.name + " (" + b.bits + "bit)</b>: MSE = " + b.mse.toExponential(4) +
    ", X-times = " + b.x.toFixed(2) + "x, Overhead = " + b.oh.toFixed(2) + "%, Size = " + b.kb.toFixed(2) + " KB";
  let ratio, text;
  if (a.bits === b.bits) {
    ratio = b.mse / a.mse;
    text = "Model B has " + ratio.toFixed(2) + "x the error of Model A (within same bit group).";
  } else {
    ratio = b.mse / a.mse;
    text = "Model B has " + ratio.toFixed(2) + "x the error of Model A (across different bit groups).";
  }
  document.getElementById("ratio").innerText = text;
  // tradeoff: size difference vs error difference
  const sizeDiff = Math.abs(a.kb - b.kb);
  const smallerMse = Math.min(a.mse, b.mse);
  const largerMse = Math.max(a.mse, b.mse);
  const errorPctMore = smallerMse > 0 ? ((largerMse - smallerMse) / smallerMse * 100) : 0;
  const bigger = a.mse > b.mse ? a.name : b.name;
  const smaller = a.mse > b.mse ? b.name : a.name;
  document.getElementById("tradeoff").innerText =
    "Size difference: " + sizeDiff.toFixed(2) + " KB. " +
    bigger + " has " + errorPctMore.toFixed(1) + "% more error than " + smaller + ".";
}

function renderTable() {
  populateSelects();
  const tbody = document.querySelector("#table tbody");
  tbody.innerHTML = "";
  filteredData().forEach(d => {
    const tr = document.createElement("tr");
    tr.innerHTML = "<td>" + d.name + "</td><td>" + d.bits + "</td><td>" +
      d.mse.toExponential(4) + "</td><td>" + d.x.toFixed(2) + "x</td><td>" +
      d.oh.toFixed(2) + "%</td><td>" + d.total + "</td><td>" + d.kb.toFixed(2) + "</td>";
    tbody.appendChild(tr);
  });
  updateCompare();
}

let sortDir = {};
function sortTable(col) {
  const fd = filteredData();
  sortDir[col] = !sortDir[col];
  const key = ["name","bits","mse","x","oh","total","kb"][col];
  fd.sort((a,b) => {
    let va = a[key], vb = b[key];
    if (typeof va === "string") return sortDir[col] ? va.localeCompare(vb) : vb.localeCompare(va);
    return sortDir[col] ? va - vb : vb - va;
  });
  const tbody = document.querySelector("#table tbody");
  tbody.innerHTML = "";
  fd.forEach(d => {
    const tr = document.createElement("tr");
    tr.innerHTML = "<td>" + d.name + "</td><td>" + d.bits + "</td><td>" +
      d.mse.toExponential(4) + "</td><td>" + d.x.toFixed(2) + "x</td><td>" +
      d.oh.toFixed(2) + "%</td><td>" + d.total + "</td><td>" + d.kb.toFixed(2) + "</td>";
    tbody.appendChild(tr);
  });
}

renderTable();
</script>
</body>
</html>
