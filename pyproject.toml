[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mixture-of-quants"
version = "1.0.0"
description = "Mixture-of-Quants (MoQ) pipeline — KLD analysis, CE computation, MCKP config optimization, and apply+evaluate for quantization research."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Waleed" }]

dependencies = [
    "torch",
    "transformers",
    "huggingface_hub",
    "datasets",
    "tqdm",
    "accelerate",
    "numpy",
    "pandas",
    "requests",
    "pytest",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools]
packages = ["moq"]

[tool.setuptools.package-data]
moq = ["*.txt", "*.cpp"]
